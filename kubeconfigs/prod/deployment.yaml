apiVersion: apps/v1
kind: Deployment
metadata:
  name:	mqtt-ingestor
  namespace: bluebird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-ingestor
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mqtt-ingestor
    spec:
      containers:
        - name: mqtt-ingestor
          image: 853583158095.dkr.ecr.eu-west-1.amazonaws.com/ecr-bluebird-mqtt-ingestor:prod
          command: ["python3", "-u", "launcher.py"]
          env:
            - name: CONF_FILE
              value: "/config.json"
          volumeMounts:
            - name: mqtt-ingestor-secret
              mountPath: /config.json
              subPath: config.json
            - name: kafka-secret
              mountPath: /app/kafka_ca_server.crt
              subPath: kafka_ca_server.crt
            - name: kafka-secret
              mountPath: /app/kafka_ca_user.crt
              subPath: kafka_ca_user.crt
            - name: kafka-secret
              mountPath: /app/kafka_key_user.key
              subPath: kafka_key_user.key
      volumes:
        - name: mqtt-ingestor-secret
          secret:
            secretName: mqtt-ingestor-secret-cassandra
            items:
              - key: config.json
                path: config.json
        - name: kafka-secret
          secret:
            secretName: kafka-secret
            items:
              - key: kafka_ca_server.crt
                path: kafka_ca_server.crt
              - key: kafka_ca_user.crt
                path: kafka_ca_user.crt
              - key: kafka_key_user.key
                path: kafka_key_user.key

 #kubectl create secret generic mqtt-ingestor-secret-cassandra --from-file=config.json=config.json -n bluebird
